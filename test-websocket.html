<!DOCTYPE html>
<html>
<head>
    <title>Easy Chat WebSocket Test</title>
    <meta charset="UTF-8">
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .section {
            margin: 20px 0;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        input, button {
            padding: 8px;
            margin: 5px;
        }
        #log {
            height: 300px;
            overflow-y: scroll;
            border: 1px solid #ccc;
            padding: 10px;
            background: #f5f5f5;
            font-family: monospace;
            font-size: 12px;
        }
        .success { color: green; }
        .error { color: red; }
        .info { color: blue; }
    </style>
</head>
<body>
    <h1>Easy Chat WebSocket 测试工具</h1>
    
    <!-- 步骤1：登录获取Token -->
    <div class="section">
        <h3>步骤1：登录获取 Token</h3>
        <input type="text" id="phone" placeholder="手机号" value="13800138000">
        <input type="password" id="password" placeholder="密码" value="123456">
        <button onclick="login()">登录</button>
        <div>Token: <span id="token" style="word-break: break-all;"></span></div>
    </div>
    
    <!-- 步骤2：连接WebSocket -->
    <div class="section">
        <h3>步骤2：连接 WebSocket</h3>
        <input type="text" id="wsUrl" value="ws://192.168.100.1:8889/ws" style="width: 300px;">
        <button onclick="connectWS()">连接</button>
        <button onclick="disconnectWS()">断开</button>
        <div>连接状态: <span id="status">未连接</span></div>
    </div>
    
    <!-- 步骤3：发送消息 -->
    <div class="section">
        <h3>步骤3：发送消息</h3>
        <div>
            消息类型: 
            <select id="msgType">
                <option value="1">单聊</option>
                <option value="2">群聊</option>
            </select>
        </div>
        <div>
            <input type="number" id="toUserId" placeholder="接收人ID" value="2">
            <input type="number" id="groupId" placeholder="群组ID" value="0">
        </div>
        <div>
            <input type="text" id="content" placeholder="消息内容" style="width: 400px;" value="测试消息">
            <button onclick="sendMsg()">发送</button>
        </div>
    </div>
    
    <!-- 日志输出 -->
    <div class="section">
        <h3>日志输出</h3>
        <div id="log"></div>
        <button onclick="clearLog()">清空日志</button>
    </div>

    <script>
        let ws = null;
        let currentToken = '';

        function log(message, type = 'info') {
            const logDiv = document.getElementById('log');
            const time = new Date().toLocaleTimeString();
            logDiv.innerHTML += `<div class="${type}">[${time}] ${message}</div>`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        // 登录
        async function login() {
            const phone = document.getElementById('phone').value;
            const password = document.getElementById('password').value;
            
            log('正在登录...', 'info');
            
            try {
                const response = await fetch('http://192.168.100.1:8888/user/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone, password })
                });
                
                const result = await response.json();
                log(`登录响应: ${JSON.stringify(result)}`, 'info');
                
                if (result.code === 0 && result.data.token) {
                    currentToken = result.data.token;
                    document.getElementById('token').textContent = currentToken;
                    log('✓ 登录成功，Token 已获取', 'success');
                } else {
                    log(`✗ 登录失败: ${result.msg}`, 'error');
                }
            } catch (error) {
                log(`✗ 登录请求失败: ${error.message}`, 'error');
            }
        }

        // 连接WebSocket
        function connectWS() {
            if (!currentToken) {
                log('✗ 请先登录获取 Token', 'error');
                return;
            }

            const wsUrl = document.getElementById('wsUrl').value;
            const fullUrl = `${wsUrl}?token=${currentToken}`;
            
            log(`正在连接: ${fullUrl}`, 'info');

            try {
                ws = new WebSocket(fullUrl);
                
                ws.onopen = function() {
                    log('✓ WebSocket 连接成功', 'success');
                    document.getElementById('status').textContent = '已连接';
                    document.getElementById('status').style.color = 'green';
                };
                
                ws.onmessage = function(event) {
                    log(`← 收到消息: ${event.data}`, 'success');
                    try {
                        const msg = JSON.parse(event.data);
                        if (msg.action === 'newMsg') {
                            log(`  新消息: ${JSON.stringify(msg.data)}`, 'info');
                        }
                    } catch (e) {}
                };
                
                ws.onerror = function(error) {
                    log(`✗ WebSocket 错误: ${error}`, 'error');
                };
                
                ws.onclose = function() {
                    log('WebSocket 连接已关闭', 'info');
                    document.getElementById('status').textContent = '未连接';
                    document.getElementById('status').style.color = 'red';
                };
            } catch (error) {
                log(`✗ 连接失败: ${error.message}`, 'error');
            }
        }

        // 断开连接
        function disconnectWS() {
            if (ws) {
                ws.close();
                ws = null;
            }
        }

        // 发送消息
        function sendMsg() {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                log('✗ WebSocket 未连接', 'error');
                return;
            }

            const type = parseInt(document.getElementById('msgType').value);
            const toUserId = parseInt(document.getElementById('toUserId').value) || 0;
            const groupId = parseInt(document.getElementById('groupId').value) || 0;
            const content = document.getElementById('content').value;

            const message = {
                type: type,
                toUserId: toUserId,
                groupId: groupId,
                content: content
            };

            log(`→ 发送消息: ${JSON.stringify(message)}`, 'info');
            ws.send(JSON.stringify(message));
        }

        function clearLog() {
            document.getElementById('log').innerHTML = '';
        }

        // 页面加载时的提示
        window.onload = function() {
            log('=== Easy Chat WebSocket 测试工具 ===', 'info');
            log('使用步骤:', 'info');
            log('1. 点击"登录"获取 Token', 'info');
            log('2. 点击"连接"建立 WebSocket 连接', 'info');
            log('3. 输入消息内容并点击"发送"', 'info');
            log('================================', 'info');
        };
    </script>
</body>
</html>
